# Netlify configuration for the portfolio (static site, no build step).
# GitHub Pages stays enabled in parallel so existing CV links keep working.

[build]
  publish = "."

# Security headers. The high value ones are enforced. The Content Security
# Policy ships in report-only first so it cannot break any page; promote it to
# an enforcing "Content-Security-Policy" once the browser console is clean.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://ka-f.fontawesome.com; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com https://kit.fontawesome.com https://cdn.credly.com; connect-src 'self' https://formspree.io https://ka-f.fontawesome.com https://cdn.credly.com; frame-src https://www.youtube.com https://www.credly.com; frame-ancestors 'self'"

# Long cache for static assets, with revalidation on the HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

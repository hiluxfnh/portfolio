<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function(){try{var t=localStorage.getItem("theme");if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Hilux Fokou Ngoumo</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/icon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#ffffff; --fg:#0a0a0a; --muted:#5b5b5b; --line:#e7e7e4; --accent:#197a56; }
    :root[data-theme="dark"] { --bg:#131209; --fg:#f4f3ee; --muted:#b7b5ab; --line:#2a2820; --accent:#54c58d; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
      font-family:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      background:var(--bg); color:var(--fg); }
    .box { max-width:520px; text-align:center; }
    .code { font-size:14px; font-weight:600; color:var(--accent); letter-spacing:0.02em; margin:0 0 14px; }
    h1 { font-size:36px; line-height:1.1; letter-spacing:-0.02em; font-weight:600; margin:0; }
    p { color:var(--muted); font-size:17px; line-height:26px; margin:18px 0 28px; }
    a.home { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
      font-weight:600; padding:12px 24px; border-radius:12px; }
    :root[data-theme="dark"] a.home { color:#0b0a05; }
    a.home:hover { filter:brightness(0.95); }
  </style>
</head>
<body>
  <main class="box">
    <p class="code">404</p>
    <h1>This page is not here.</h1>
    <p>The link may be old or mistyped. You can head back to the homepage.</p>
    <a class="home" href="/">Go to homepage</a>
  </main>
</body>
</html>
